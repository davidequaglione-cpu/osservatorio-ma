<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Segnalazione M&amp;A — Osservatorio Abruzzo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F8FC; font-family: 'Source Serif 4', Georgia, serif; }
    button { font-family: inherit; }
    select, input, textarea { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const NAVY    = "#1B4F8A";
    const BLUE    = "#2980B9";
    const LIGHT   = "#EBF5FB";
    const BORDER  = "#D0DCE8";
    const SUCCESS = "#1A7A4A";
    const WARN    = "#B7770D";
    const DANGER  = "#C0392B";
    const MUTED   = "#6B7C93";
    const BG      = "#F5F8FC";

    // ── Dati di lookup ────────────────────────────────────────────────────────
    const LISTS = {
      fonte_primaria:       ["Registro Imprese","Stampa nazionale","Stampa locale","Segnalazione advisor","Database commerciale","Comunicato societario","Altro"],
      tipologia_operazione: ["Buy out","Expansion","Replacement","Infrastructure","Turnaround"],
      deal_origination:     ["Family & Private","Secondary Buy Out","Public to Private","Local Parent (spin-off)","Receivership / Distressed","Other"],
      modalita_pagamento:   ["Cash","Stock","Misto","Earn-out","n.d."],
      acquirente_tipo:      ["PE / Fondo","Corporate strategico","Family Office","Holding privata","Infra fund","Altro"],
      target_provincia:     ["CH — Chieti","PE — Pescara","TE — Teramo","AQ — L'Aquila"],
      settore_pem:          ["Industrial products","Consumer goods","Food & beverage","ICT / Software","Healthcare / Pharma","Financial services","Cleantech","Leisure","Professional & social services","Other"],
      target_dimensione:    ["< 2M (micro)","2–10M (piccola)","10–50M (media)","50–300M (grande)","> 300M (molto grande)"],
      affidabilita:         ["Alta","Media","Bassa"],
    };

    const INITIAL = {
      data_annuncio:"", data_closing:"", fonte_primaria:"",
      tipologia_operazione:"", deal_origination:"", quota_acquisita_pct:"",
      equity_investito_mln:"", enterprise_value_mln:"", ev_ebitda_x:"", ev_sales_x:"",
      modalita_pagamento:"", addon_flag:"No", platform_company:"", cross_border_flag:"No",
      acquirente_nome:"", acquirente_tipo:"", acquirente_paese:"IT", coinvestitori:"",
      advisor_legale_acquirente:"", advisor_fin_acquirente:"",
      target_nome:"", target_cf_piva:"", target_provincia:"", target_comune:"",
      settore_pem:"", codice_ateco:"", attivita_descrizione:"", target_dimensione:"",
      fatturato_t0_mln:"", fatturato_t1_mln:"", fatturato_t2_mln:"",
      ebitda_mln:"", dipendenti:"",
      affidabilita:"", url_fonte:"", note:"",
      compilatore_nome:"", compilatore_email:"", compilatore_studio:"",
    };

    const STEPS = [
      { id:"A", label:"Identificazione", icon:"🗓" },
      { id:"B", label:"Deal",            icon:"🤝" },
      { id:"C", label:"Acquirente",      icon:"🏢" },
      { id:"D", label:"Target",          icon:"🏭" },
      { id:"E", label:"Financials",      icon:"📊" },
      { id:"F", label:"Metadati",        icon:"📋" },
    ];

    // ── Componenti UI base ────────────────────────────────────────────────────
    function Label({ children, required }) {
      return (
        <label style={{ display:"block", fontSize:12, fontWeight:600, color:"#2C3E50",
          letterSpacing:"0.04em", textTransform:"uppercase", marginBottom:5 }}>
          {children}{required && <span style={{ color:DANGER, marginLeft:3 }}>*</span>}
        </label>
      );
    }

    function Field({ label, required, hint, error, children }) {
      return (
        <div style={{ marginBottom:18 }}>
          {label && <Label required={required}>{label}</Label>}
          {children}
          {hint && !error && <p style={{ margin:"4px 0 0", fontSize:11, color:MUTED }}>{hint}</p>}
          {error && <p style={{ margin:"4px 0 0", fontSize:11, color:DANGER }}>⚠ {error}</p>}
        </div>
      );
    }

    const inputBase = {
      width:"100%", boxSizing:"border-box", padding:"9px 12px",
      border:`1.5px solid ${BORDER}`, borderRadius:7, fontSize:13,
      fontFamily:"'Source Serif 4', Georgia, serif",
      background:"#fff", color:"#1A1A2E", outline:"none",
      transition:"border-color 0.15s",
    };

    function Input({ value, onChange, type="text", placeholder, style: extraStyle, ...props }) {
      const [focused, setFocused] = useState(false);
      return (
        <input type={type} value={value} onChange={onChange} placeholder={placeholder}
          style={{ ...inputBase, borderColor: focused ? NAVY : BORDER, ...extraStyle }}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} {...props} />
      );
    }

    function Select({ value, onChange, options, placeholder="Selezionare..." }) {
      const [focused, setFocused] = useState(false);
      return (
        <select value={value} onChange={onChange}
          style={{ ...inputBase, borderColor: focused ? NAVY : BORDER,
            color: value ? "#1A1A2E" : MUTED, cursor:"pointer" }}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}>
          <option value="" disabled>{placeholder}</option>
          {options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      );
    }

    function Textarea({ value, onChange, placeholder, rows=3 }) {
      const [focused, setFocused] = useState(false);
      return (
        <textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows}
          style={{ ...inputBase, borderColor: focused ? NAVY : BORDER, resize:"vertical", lineHeight:1.6 }}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} />
      );
    }

    function TogglePill({ value, onChange }) {
      return (
        <div style={{ display:"flex", gap:8 }}>
          {["Sì","No"].map(v => (
            <button key={v} type="button" onClick={() => onChange({ target:{ value: v }})}
              style={{
                padding:"7px 22px", borderRadius:20, fontSize:13, fontWeight:600,
                border:`1.5px solid ${value===v ? NAVY : BORDER}`,
                background: value===v ? NAVY : "#fff",
                color: value===v ? "#fff" : MUTED,
                cursor:"pointer", transition:"all 0.15s",
              }}>{v}</button>
          ))}
        </div>
      );
    }

    function Grid({ cols=2, children }) {
      return (
        <div style={{ display:"grid", gridTemplateColumns:`repeat(${cols}, 1fr)`, gap:"0 20px" }}>
          {children}
        </div>
      );
    }

    function SectionTitle({ children }) {
      return (
        <div style={{ borderLeft:`3px solid ${NAVY}`, paddingLeft:10, marginBottom:20, marginTop:4 }}>
          <p style={{ margin:0, fontSize:11, fontWeight:700, color:NAVY,
            letterSpacing:"0.06em", textTransform:"uppercase" }}>{children}</p>
        </div>
      );
    }

    function InfoBox({ children }) {
      return (
        <div style={{ background:LIGHT, border:`1px solid ${BORDER}`, borderRadius:8,
          padding:"10px 14px", marginBottom:18, fontSize:12, color:"#1A3A5C", lineHeight:1.6 }}>
          {children}
        </div>
      );
    }

    // ── Calcoli automatici ────────────────────────────────────────────────────
    function calcCAGR(t0, t2) {
      const a = parseFloat(t0), b = parseFloat(t2);
      if (!a || !b || b === 0) return null;
      return (((a / b) ** (1 / 2)) - 1) * 100;
    }
    function calcMargin(ebitda, fat) {
      const a = parseFloat(ebitda), b = parseFloat(fat);
      if (!a || !b || b === 0) return null;
      return (a / b) * 100;
    }

    // ── Validazione per step ──────────────────────────────────────────────────
    function validateStep(step, data) {
      const errs = {};
      if (step === 0) {
        if (!data.data_annuncio) errs.data_annuncio = "Data obbligatoria";
        if (!data.fonte_primaria) errs.fonte_primaria = "Fonte obbligatoria";
      }
      if (step === 1) {
        if (!data.tipologia_operazione) errs.tipologia_operazione = "Campo obbligatorio";
        if (!data.deal_origination) errs.deal_origination = "Campo obbligatorio";
      }
      if (step === 2) {
        if (!data.acquirente_nome) errs.acquirente_nome = "Campo obbligatorio";
        if (!data.acquirente_tipo) errs.acquirente_tipo = "Campo obbligatorio";
        if (!data.acquirente_paese) errs.acquirente_paese = "Campo obbligatorio";
      }
      if (step === 3) {
        if (!data.target_nome) errs.target_nome = "Campo obbligatorio";
        if (!data.target_provincia) errs.target_provincia = "Campo obbligatorio";
        if (!data.settore_pem) errs.settore_pem = "Campo obbligatorio";
        if (!data.target_dimensione) errs.target_dimensione = "Campo obbligatorio";
      }
      if (step === 5) {
        if (!data.affidabilita) errs.affidabilita = "Campo obbligatorio";
        if (!data.compilatore_nome) errs.compilatore_nome = "Campo obbligatorio";
        if (!data.compilatore_email) errs.compilatore_email = "Campo obbligatorio";
      }
      return errs;
    }

    // ── Generazione CSV ───────────────────────────────────────────────────────
    const PIPELINE_COLS = [
      "deal_id","data_annuncio","data_closing","anno","fonte_primaria",
      "tipologia_operazione","deal_origination","quota_acquisita_pct",
      "equity_investito_mln","enterprise_value_mln","ev_ebitda_x","ev_sales_x",
      "modalita_pagamento","addon_flag","platform_company","cross_border_flag",
      "acquirente_nome","acquirente_tipo","acquirente_paese","acquirente_estero",
      "coinvestitori","advisor_legale_acquirente","advisor_fin_acquirente",
      "target_nome","target_cf_piva","target_provincia","target_comune",
      "settore_pem","codice_ateco","attivita_descrizione","target_dimensione",
      "fatturato_t0_mln","fatturato_t1_mln","fatturato_t2_mln",
      "fatturato_cagr_pct","ebitda_mln","ebitda_margin_pct","dipendenti",
      "affidabilita","url_fonte","data_inserimento","note",
      "compilatore_nome","compilatore_email","compilatore_studio",
    ];

    // URL del Google Apps Script Web App — incollare dopo il deploy, poi aggiornare su GitHub
    const APPS_SCRIPT_URL = "";

    function toCSV(records) {
      if (!records.length) return "";
      const escape = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const header = PIPELINE_COLS.map(escape).join(",");
      const rows = records.map(r =>
        PIPELINE_COLS.map(col => escape(r[col] ?? "")).join(",")
      );
      return [header, ...rows].join("\n");
    }

    // ══════════════════════════════════════════════════════════════════════════
    // COMPONENTE PRINCIPALE
    // ══════════════════════════════════════════════════════════════════════════
    function FormMA() {
      const [step, setStep] = useState(0);
      const [data, setData] = useState(INITIAL);
      const [errors, setErrors] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [records, setRecords] = useState([]);
      const [showRecords, setShowRecords] = useState(false);
      const [saveMsg, setSaveMsg] = useState("");
      const [sendStatus, setSendStatus] = useState(null); // null | "sending" | "ok" | "error"

      useEffect(() => {
        try {
          const r = localStorage.getItem("ma_records");
          if (r) setRecords(JSON.parse(r));
        } catch {}
      }, []);

      const set = useCallback((field) => (e) => {
        setData(d => ({ ...d, [field]: e.target.value }));
        setErrors(er => { const n = { ...er }; delete n[field]; return n; });
      }, []);

      const next = () => {
        const errs = validateStep(step, data);
        if (Object.keys(errs).length) { setErrors(errs); return; }
        setErrors({});
        setStep(s => s + 1);
        window.scrollTo(0, 0);
      };

      const prev = () => { setStep(s => s - 1); window.scrollTo(0, 0); };

      const submit = () => {
        const errs = validateStep(5, data);
        if (Object.keys(errs).length) { setErrors(errs); return; }
        const now = new Date().toISOString().slice(0,10);
        const idx = records.length + 1;
        const anno = data.data_annuncio ? new Date(data.data_annuncio).getFullYear() : "";
        const cagr = calcCAGR(data.fatturato_t0_mln, data.fatturato_t2_mln);
        const margin = calcMargin(data.ebitda_mln, data.fatturato_t0_mln);
        const record = {
          deal_id: anno ? `ABR-${anno}-${String(idx).padStart(3,"0")}` : `ABR-???-${String(idx).padStart(3,"0")}`,
          data_annuncio: data.data_annuncio,
          data_closing: data.data_closing,
          anno,
          fonte_primaria: data.fonte_primaria,
          tipologia_operazione: data.tipologia_operazione,
          deal_origination: data.deal_origination,
          quota_acquisita_pct: data.quota_acquisita_pct,
          equity_investito_mln: data.equity_investito_mln,
          enterprise_value_mln: data.enterprise_value_mln,
          ev_ebitda_x: data.ev_ebitda_x,
          ev_sales_x: data.ev_sales_x,
          modalita_pagamento: data.modalita_pagamento,
          addon_flag: data.addon_flag,
          platform_company: data.addon_flag==="Sì" ? data.platform_company : "",
          cross_border_flag: data.cross_border_flag,
          acquirente_nome: data.acquirente_nome,
          acquirente_tipo: data.acquirente_tipo,
          acquirente_paese: data.acquirente_paese,
          acquirente_estero: data.acquirente_paese?.toUpperCase() !== "IT" ? "Sì" : "No",
          coinvestitori: data.coinvestitori,
          advisor_legale_acquirente: data.advisor_legale_acquirente,
          advisor_fin_acquirente: data.advisor_fin_acquirente,
          target_nome: data.target_nome,
          target_cf_piva: data.target_cf_piva,
          target_provincia: data.target_provincia,
          target_comune: data.target_comune,
          settore_pem: data.settore_pem,
          codice_ateco: data.codice_ateco,
          attivita_descrizione: data.attivita_descrizione,
          target_dimensione: data.target_dimensione,
          fatturato_t0_mln: data.fatturato_t0_mln,
          fatturato_t1_mln: data.fatturato_t1_mln,
          fatturato_t2_mln: data.fatturato_t2_mln,
          fatturato_cagr_pct: cagr !== null ? `${cagr.toFixed(1)}%` : "n.d.",
          ebitda_mln: data.ebitda_mln,
          ebitda_margin_pct: margin !== null ? `${margin.toFixed(1)}%` : "n.d.",
          dipendenti: data.dipendenti,
          affidabilita: data.affidabilita,
          url_fonte: data.url_fonte,
          data_inserimento: now,
          note: data.note,
          compilatore_nome: data.compilatore_nome,
          compilatore_email: data.compilatore_email,
          compilatore_studio: data.compilatore_studio,
        };
        const newRecords = [...records, record];
        try {
          localStorage.setItem("ma_records", JSON.stringify(newRecords));
          setSaveMsg("✓ Salvato");
          setTimeout(() => setSaveMsg(""), 3000);
        } catch {}
        setRecords(newRecords);
        setSubmitted(true);
        if (APPS_SCRIPT_URL) {
          setSendStatus("sending");
          fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(record),
          })
            .then(r => r.json())
            .then(j => setSendStatus(j.status === "ok" || j.status === "duplicate" ? "ok" : "error"))
            .catch(() => setSendStatus("error"));
        }
      };

      const downloadSingle = () => {
        const last = records[records.length - 1];
        if (!last) return;
        const csv = toCSV([last]);
        const blob = new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `deal_${last.deal_id || "nuovo"}_${new Date().toISOString().slice(0,10)}.csv`;
        a.click(); URL.revokeObjectURL(url);
      };

      const reset = () => { setData(INITIAL); setStep(0); setSubmitted(false); setErrors({}); setSendStatus(null); };

      const downloadCSV = () => {
        const csv = toCSV(records);
        const blob = new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `MA_Abruzzo_export_${new Date().toISOString().slice(0,10)}.csv`;
        a.click(); URL.revokeObjectURL(url);
      };

      const deleteRecord = (idx) => {
        const updated = records.filter((_,i) => i !== idx);
        setRecords(updated);
        try { localStorage.setItem("ma_records", JSON.stringify(updated)); } catch {}
      };

      return (
        <div style={{ fontFamily:"'Source Serif 4', Georgia, serif", background:BG,
          minHeight:"100vh", padding:"0 0 60px" }}>

          {/* Header */}
          <div style={{ background:NAVY, padding:"18px 28px", display:"flex",
            alignItems:"center", justifyContent:"space-between" }}>
            <div>
              <p style={{ margin:0, fontSize:11, color:"#7FB3D3", letterSpacing:"0.1em",
                textTransform:"uppercase", fontWeight:600 }}>Osservatorio M&amp;A · Università degli Studi d'Abruzzo</p>
              <p style={{ margin:"2px 0 0", fontSize:18, color:"#fff", fontWeight:700 }}>
                Segnalazione operazione M&amp;A — Abruzzo
              </p>
            </div>
            <div style={{ display:"flex", gap:10 }}>
              {records.length > 0 && (
                <button type="button" onClick={() => setShowRecords(!showRecords)}
                  style={{ background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.3)",
                    color:"#fff", borderRadius:6, padding:"7px 14px", cursor:"pointer", fontSize:12 }}>
                  {showRecords ? "← Form" : `📋 Archivio (${records.length})`}
                </button>
              )}
            </div>
          </div>

          <div style={{ maxWidth:720, margin:"0 auto", padding:"28px 20px 0" }}>

            {showRecords ? (
              <ArchiveView records={records} onDelete={deleteRecord} onDownload={downloadCSV} />
            ) : submitted ? (
              <SuccessView record={records[records.length-1]} onNew={reset}
                onShowArchive={() => setShowRecords(true)} total={records.length}
                onDownloadSingle={downloadSingle} sendStatus={sendStatus} />
            ) : (
              <>
                <Stepper steps={STEPS} current={step} />

                <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${BORDER}`,
                  padding:"28px 32px", marginTop:0 }}>
                  {step === 0 && <StepA data={data} set={set} errors={errors} />}
                  {step === 1 && <StepB data={data} set={set} errors={errors} />}
                  {step === 2 && <StepC data={data} set={set} errors={errors} />}
                  {step === 3 && <StepD data={data} set={set} errors={errors} />}
                  {step === 4 && <StepE data={data} set={set} errors={errors} />}
                  {step === 5 && <StepF data={data} set={set} errors={errors} />}
                </div>

                <div style={{ display:"flex", justifyContent:"space-between",
                  alignItems:"center", marginTop:20 }}>
                  <button type="button" onClick={prev} disabled={step===0}
                    style={{ padding:"10px 24px", borderRadius:8, border:`1.5px solid ${BORDER}`,
                      background:step===0?"#f5f5f5":"#fff", color:step===0?MUTED:NAVY,
                      fontSize:13, fontWeight:600, cursor:step===0?"not-allowed":"pointer" }}>
                    ← Indietro
                  </button>
                  <span style={{ fontSize:11, color:MUTED }}>
                    {step+1} / {STEPS.length}
                  </span>
                  {step < STEPS.length - 1 ? (
                    <button type="button" onClick={next}
                      style={{ padding:"10px 28px", borderRadius:8, border:"none",
                        background:NAVY, color:"#fff", fontSize:13, fontWeight:600,
                        cursor:"pointer", boxShadow:"0 2px 8px rgba(27,79,138,0.25)" }}>
                      Avanti →
                    </button>
                  ) : (
                    <button type="button" onClick={submit}
                      style={{ padding:"10px 28px", borderRadius:8, border:"none",
                        background:SUCCESS, color:"#fff", fontSize:13, fontWeight:600,
                        cursor:"pointer", boxShadow:"0 2px 8px rgba(26,122,74,0.3)" }}>
                      ✓ Invia segnalazione
                    </button>
                  )}
                </div>
                {saveMsg && <p style={{ textAlign:"center", color:SUCCESS, fontSize:12, marginTop:8 }}>{saveMsg}</p>}
              </>
            )}
          </div>
        </div>
      );
    }

    // ── Stepper ───────────────────────────────────────────────────────────────
    function Stepper({ steps, current }) {
      return (
        <div style={{ display:"flex", marginBottom:20, gap:0 }}>
          {steps.map((s, i) => {
            const done = i < current;
            const active = i === current;
            return (
              <div key={s.id} style={{ flex:1, textAlign:"center" }}>
                <div style={{ display:"flex", alignItems:"center" }}>
                  {i > 0 && <div style={{ flex:1, height:2,
                    background: done||active ? NAVY : BORDER }} />}
                  <div style={{ width:32, height:32, borderRadius:"50%", flexShrink:0,
                    display:"flex", alignItems:"center", justifyContent:"center", fontSize:13,
                    background: done ? NAVY : active ? BLUE : "#fff",
                    color: done||active ? "#fff" : MUTED,
                    border:`2px solid ${done||active ? NAVY : BORDER}`,
                    fontWeight:700, zIndex:1 }}>
                    {done ? "✓" : s.icon}
                  </div>
                  {i < steps.length-1 && <div style={{ flex:1, height:2,
                    background: done ? NAVY : BORDER }} />}
                </div>
                <p style={{ margin:"5px 0 0", fontSize:10, fontWeight:active?700:400,
                  color: active ? NAVY : done ? "#555" : MUTED, letterSpacing:"0.03em" }}>
                  {s.id} · {s.label}
                </p>
              </div>
            );
          })}
        </div>
      );
    }

    // ── Step A: Identificazione ───────────────────────────────────────────────
    function StepA({ data, set, errors }) {
      return (
        <>
          <SectionTitle>A — Identificazione del deal</SectionTitle>
          <InfoBox>
            Inserire i dati di base per identificare l'operazione. La data di annuncio è il campo
            più critico: l'ID deal viene generato automaticamente dall'osservatorio.
          </InfoBox>
          <Grid cols={2}>
            <Field label="Data annuncio" required error={errors.data_annuncio}
              hint="Data di primo annuncio pubblico (anche solo anno)">
              <Input type="date" value={data.data_annuncio} onChange={set("data_annuncio")} />
            </Field>
            <Field label="Data closing" hint="Se nota e diversa dall'annuncio">
              <Input type="date" value={data.data_closing} onChange={set("data_closing")} />
            </Field>
          </Grid>
          <Field label="Fonte primaria" required error={errors.fonte_primaria}
            hint="Da quale fonte ha appreso o verificato l'operazione?">
            <Select value={data.fonte_primaria} onChange={set("fonte_primaria")}
              options={LISTS.fonte_primaria} />
          </Field>
        </>
      );
    }

    // ── Step B: Deal ──────────────────────────────────────────────────────────
    function StepB({ data, set, errors }) {
      return (
        <>
          <SectionTitle>B — Caratteristiche del deal</SectionTitle>
          <Grid cols={2}>
            <Field label="Tipologia operazione" required error={errors.tipologia_operazione}
              hint="Classificazione PEM® LIUC">
              <Select value={data.tipologia_operazione} onChange={set("tipologia_operazione")}
                options={LISTS.tipologia_operazione} />
            </Field>
            <Field label="Deal origination" required error={errors.deal_origination}
              hint="Origine/motivazione del deal">
              <Select value={data.deal_origination} onChange={set("deal_origination")}
                options={LISTS.deal_origination} />
            </Field>
          </Grid>
          <Grid cols={2}>
            <Field label="Quota acquisita (%)" hint="Es. 60 per 60%. Se solo range: 51, 75, 90, 100">
              <Input type="number" value={data.quota_acquisita_pct} onChange={set("quota_acquisita_pct")}
                placeholder="es. 60" min="0" max="100" />
            </Field>
            <Field label="Modalità pagamento">
              <Select value={data.modalita_pagamento} onChange={set("modalita_pagamento")}
                options={LISTS.modalita_pagamento} />
            </Field>
          </Grid>
          <Grid cols={2}>
            <Field label="Equity investito (€M)" hint="Solo equity, esclude debito. Lasciare vuoto se n.d.">
              <Input type="number" value={data.equity_investito_mln} onChange={set("equity_investito_mln")}
                placeholder="es. 12.5" min="0" step="0.1" />
            </Field>
            <Field label="Enterprise Value (€M)" hint="Valore 100% azienda al momento dell'acq.">
              <Input type="number" value={data.enterprise_value_mln} onChange={set("enterprise_value_mln")}
                placeholder="es. 45.0" min="0" step="0.1" />
            </Field>
          </Grid>
          <Grid cols={2}>
            <Field label="EV/EBITDA (x)" hint="Multiplo valutazione. Media PEM® 2025: 11,6x">
              <Input type="number" value={data.ev_ebitda_x} onChange={set("ev_ebitda_x")}
                placeholder="es. 8.5" min="0" step="0.1" />
            </Field>
            <Field label="EV/Sales (x)">
              <Input type="number" value={data.ev_sales_x} onChange={set("ev_sales_x")}
                placeholder="es. 1.2" min="0" step="0.1" />
            </Field>
          </Grid>
          <Grid cols={2}>
            <Field label="Operazione add-on?" hint="Add-on = acquisizione da parte di una portfolio company PE">
              <TogglePill value={data.addon_flag} onChange={set("addon_flag")} />
            </Field>
            <Field label="Cross-border?" hint="Acquirente estero o target estero">
              <TogglePill value={data.cross_border_flag} onChange={set("cross_border_flag")} />
            </Field>
          </Grid>
          {data.addon_flag === "Sì" && (
            <Field label="Platform company" hint="Ragione sociale della portfolio company che effettua l'add-on">
              <Input value={data.platform_company} onChange={set("platform_company")}
                placeholder="es. Alfa Group SpA" />
            </Field>
          )}
        </>
      );
    }

    // ── Step C: Acquirente ────────────────────────────────────────────────────
    function StepC({ data, set, errors }) {
      const estero = data.acquirente_paese?.toUpperCase() !== "IT" && data.acquirente_paese !== "";
      return (
        <>
          <SectionTitle>C — Acquirente / investitore</SectionTitle>
          <Field label="Ragione sociale acquirente" required error={errors.acquirente_nome}
            hint="Nome completo del lead investor o acquirente strategico">
            <Input value={data.acquirente_nome} onChange={set("acquirente_nome")}
              placeholder="es. Ardian Italia SGR" />
          </Field>
          <Grid cols={2}>
            <Field label="Tipo acquirente" required error={errors.acquirente_tipo}>
              <Select value={data.acquirente_tipo} onChange={set("acquirente_tipo")}
                options={LISTS.acquirente_tipo} />
            </Field>
            <Field label="Paese acquirente" required error={errors.acquirente_paese}
              hint="Codice ISO: IT, FR, DE, US, GB…">
              <Input value={data.acquirente_paese} onChange={set("acquirente_paese")}
                placeholder="IT" maxLength={2}
                style={{ textTransform:"uppercase" }} />
            </Field>
          </Grid>
          {estero && (
            <div style={{ background:"#EBF5FB", border:`1px solid #AED6F1`, borderRadius:8,
              padding:"8px 14px", marginBottom:16, fontSize:12, color:"#1A3A5C" }}>
              🌐 Acquirente estero rilevato — verrà classificato automaticamente come cross-border
            </div>
          )}
          <Field label="Co-investitori" hint="Separare con punto e virgola se più di uno">
            <Input value={data.coinvestitori} onChange={set("coinvestitori")}
              placeholder="es. Fondo Italiano d'Investimento SGR; XYZ Capital" />
          </Field>
          <Grid cols={2}>
            <Field label="Advisor legale" hint="Studio legale dell'acquirente">
              <Input value={data.advisor_legale_acquirente} onChange={set("advisor_legale_acquirente")}
                placeholder="es. Bonelli Erede" />
            </Field>
            <Field label="Advisor finanziario" hint="Investment bank o boutique M&A">
              <Input value={data.advisor_fin_acquirente} onChange={set("advisor_fin_acquirente")}
                placeholder="es. Mediobanca, KPMG CF" />
            </Field>
          </Grid>
        </>
      );
    }

    // ── Step D: Target ────────────────────────────────────────────────────────
    function StepD({ data, set, errors }) {
      return (
        <>
          <SectionTitle>D — Impresa target (anagrafica)</SectionTitle>
          <Field label="Ragione sociale target" required error={errors.target_nome}
            hint="Nome dell'impresa acquisita al momento del deal">
            <Input value={data.target_nome} onChange={set("target_nome")}
              placeholder="es. Plastipak Abruzzo Srl" />
          </Field>
          <Grid cols={2}>
            <Field label="P.IVA / Codice fiscale" hint="11 cifre — permette lookup automatico CCIAA">
              <Input value={data.target_cf_piva} onChange={set("target_cf_piva")}
                placeholder="es. 01234567890" maxLength={16} />
            </Field>
            <Field label="Settore PEM®" required error={errors.settore_pem}
              hint="Classificazione PEM® LIUC (basata su SIC)">
              <Select value={data.settore_pem} onChange={set("settore_pem")}
                options={LISTS.settore_pem} />
            </Field>
          </Grid>
          <Grid cols={2}>
            <Field label="Provincia" required error={errors.target_provincia}>
              <Select value={data.target_provincia} onChange={set("target_provincia")}
                options={LISTS.target_provincia} />
            </Field>
            <Field label="Comune" hint="Sede legale">
              <Input value={data.target_comune} onChange={set("target_comune")}
                placeholder="es. Lanciano" />
            </Field>
          </Grid>
          <Grid cols={2}>
            <Field label="Codice ATECO" hint="Es. 29.10 — da Registro Imprese">
              <Input value={data.codice_ateco} onChange={set("codice_ateco")}
                placeholder="es. 29.10" />
            </Field>
            <Field label="Fascia dimensionale" required error={errors.target_dimensione}
              hint="Basata su fatturato t-1">
              <Select value={data.target_dimensione} onChange={set("target_dimensione")}
                options={LISTS.target_dimensione} />
            </Field>
          </Grid>
          <Field label="Descrizione attività" hint="2-3 righe sull'attività svolta dalla target">
            <Textarea value={data.attivita_descrizione} onChange={set("attivita_descrizione")}
              placeholder="es. Produzione di componenti in plastica per il settore automotive. Principale cliente: Stellantis Val di Sangro." />
          </Field>
        </>
      );
    }

    // ── Step E: Financials ────────────────────────────────────────────────────
    function StepE({ data, set, errors }) {
      const cagr = calcCAGR(data.fatturato_t0_mln, data.fatturato_t2_mln);
      const margin = calcMargin(data.ebitda_mln, data.fatturato_t0_mln);
      return (
        <>
          <SectionTitle>E — Dati economico-finanziari target</SectionTitle>
          <InfoBox>
            Tutti i valori in milioni di euro (€M). Fonte consigliata: bilancio depositato presso
            CCIAA (disponibile gratuitamente su Registro Imprese o Cerved Open Data).
            Lasciare vuoto se il dato non è disponibile pubblicamente.
          </InfoBox>
          <Grid cols={3}>
            <Field label="Fatturato t-1 (€M)" hint="Esercizio precedente al deal">
              <Input type="number" value={data.fatturato_t0_mln} onChange={set("fatturato_t0_mln")}
                placeholder="es. 24.5" min="0" step="0.1" />
            </Field>
            <Field label="Fatturato t-2 (€M)">
              <Input type="number" value={data.fatturato_t1_mln} onChange={set("fatturato_t1_mln")}
                placeholder="es. 21.0" min="0" step="0.1" />
            </Field>
            <Field label="Fatturato t-3 (€M)">
              <Input type="number" value={data.fatturato_t2_mln} onChange={set("fatturato_t2_mln")}
                placeholder="es. 18.2" min="0" step="0.1" />
            </Field>
          </Grid>

          {cagr !== null && (
            <div style={{ background: cagr >= 0 ? "#E8F8F0" : "#FEF0EE",
              border:`1px solid ${cagr >= 0 ? "#A9DFC1" : "#F5C6C2"}`,
              borderRadius:8, padding:"8px 14px", marginBottom:16,
              display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:20 }}>{cagr >= 0 ? "📈" : "📉"}</span>
              <div>
                <p style={{ margin:0, fontSize:11, color:MUTED }}>CAGR fatturato (calcolato automaticamente)</p>
                <p style={{ margin:0, fontSize:18, fontWeight:700,
                  color: cagr >= 0 ? SUCCESS : DANGER }}>
                  {cagr >= 0 ? "+" : ""}{cagr.toFixed(1)}%
                </p>
              </div>
            </div>
          )}

          <Grid cols={2}>
            <Field label="EBITDA t-1 (€M)">
              <Input type="number" value={data.ebitda_mln} onChange={set("ebitda_mln")}
                placeholder="es. 4.2" step="0.1" />
            </Field>
            <Field label="Dipendenti" hint="N. dipendenti al momento del deal">
              <Input type="number" value={data.dipendenti} onChange={set("dipendenti")}
                placeholder="es. 85" min="0" step="1" />
            </Field>
          </Grid>

          {margin !== null && (
            <div style={{ background: margin >= 10 ? "#E8F8F0" : "#FFF9E6",
              border:`1px solid ${margin >= 10 ? "#A9DFC1" : "#F9E4A0"}`,
              borderRadius:8, padding:"8px 14px",
              display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:20 }}>⚙️</span>
              <div>
                <p style={{ margin:0, fontSize:11, color:MUTED }}>Margine EBITDA (calcolato automaticamente)</p>
                <p style={{ margin:0, fontSize:18, fontWeight:700,
                  color: margin >= 10 ? SUCCESS : WARN }}>
                  {margin.toFixed(1)}%
                </p>
              </div>
            </div>
          )}
        </>
      );
    }

    // ── Step F: Metadati ──────────────────────────────────────────────────────
    function StepF({ data, set, errors }) {
      return (
        <>
          <SectionTitle>F — Metadati e compilatore</SectionTitle>
          <Field label="Affidabilità della fonte" required error={errors.affidabilita}>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {[
                { v:"Alta",  desc:"Fonte ufficiale verificabile (CCIAA, comunicato)", bg:"#E8F8F0", bc:"#A9DFC1", tc:SUCCESS },
                { v:"Media", desc:"Stampa + riscontro indiretto",                     bg:"#FFF9E6", bc:"#F9E4A0", tc:WARN },
                { v:"Bassa", desc:"Fonte singola non verificata",                     bg:"#FEF0EE", bc:"#F5C6C2", tc:DANGER },
              ].map(({ v, desc, bg, bc, tc }) => (
                <button key={v} type="button"
                  onClick={() => set("affidabilita")({ target:{ value: v }})}
                  style={{ flex:1, minWidth:150, padding:"10px 12px", borderRadius:8, cursor:"pointer",
                    border:`2px solid ${data.affidabilita===v ? bc : BORDER}`,
                    background: data.affidabilita===v ? bg : "#fff",
                    textAlign:"left", transition:"all 0.15s" }}>
                  <p style={{ margin:0, fontWeight:700, fontSize:13, color: data.affidabilita===v ? tc : MUTED }}>{v}</p>
                  <p style={{ margin:"2px 0 0", fontSize:11, color:MUTED }}>{desc}</p>
                </button>
              ))}
            </div>
            {errors.affidabilita && <p style={{ margin:"4px 0 0", fontSize:11, color:DANGER }}>⚠ {errors.affidabilita}</p>}
          </Field>
          <Field label="URL / riferimento fonte" hint="Link articolo, comunicato o citazione bibliografica">
            <Input value={data.url_fonte} onChange={set("url_fonte")}
              placeholder="https://… oppure: Autore, Anno, Testata, p. XX" />
          </Field>
          <Field label="Note aggiuntive" hint="Ambiguità, dati stimati, informazioni da verificare">
            <Textarea value={data.note} onChange={set("note")} rows={3}
              placeholder="es. Il valore della transazione è una stima basata su fonti di settore..." />
          </Field>

          <div style={{ height:1, background:BORDER, margin:"24px 0" }} />
          <SectionTitle>Dati compilatore</SectionTitle>
          <Grid cols={2}>
            <Field label="Nome e cognome" required error={errors.compilatore_nome}>
              <Input value={data.compilatore_nome} onChange={set("compilatore_nome")}
                placeholder="es. Mario Rossi" />
            </Field>
            <Field label="Email" required error={errors.compilatore_email}>
              <Input type="email" value={data.compilatore_email} onChange={set("compilatore_email")}
                placeholder="m.rossi@studio.it" />
            </Field>
          </Grid>
          <Field label="Studio / organizzazione" hint="Facoltativo — aiuta ad attribuire la segnalazione">
            <Input value={data.compilatore_studio} onChange={set("compilatore_studio")}
              placeholder="es. Studio Legale Rossi & Associati" />
          </Field>
          <InfoBox>
            I dati del compilatore sono usati solo per eventuali richieste di chiarimento da parte
            dell'Osservatorio e non vengono pubblicati nei report. L'operazione segnalata sarà
            verificata e integrata nel dataset entro 5 giorni lavorativi.
          </InfoBox>
        </>
      );
    }

    // ── Schermata successo ────────────────────────────────────────────────────
    function SuccessView({ record, onNew, onShowArchive, total, onDownloadSingle, sendStatus }) {
      return (
        <div style={{ padding:"32px 20px" }}>
          <div style={{ textAlign:"center", marginBottom:28 }}>
            <div style={{ fontSize:48, marginBottom:12 }}>✅</div>
            <h2 style={{ color:SUCCESS, margin:"0 0 6px", fontWeight:700 }}>Segnalazione registrata</h2>
            <p style={{ color:MUTED, fontSize:13, margin:0 }}>ID: <span style={{ fontFamily:"monospace",
              fontWeight:700, color:NAVY }}>{record?.deal_id}</span></p>
          </div>

          {sendStatus && (
            <div style={{
              maxWidth:560, margin:"0 auto 20px", padding:"10px 16px", borderRadius:8,
              display:"flex", alignItems:"center", gap:10,
              background: sendStatus==="ok" ? "#E8F8F0" : sendStatus==="error" ? "#FEF0EE" : "#EBF5FB",
              border:`1px solid ${sendStatus==="ok" ? "#A9DFC1" : sendStatus==="error" ? "#F5C6C2" : "#AED6F1"}`,
            }}>
              <span style={{ fontSize:18 }}>
                {sendStatus==="sending" ? "⏳" : sendStatus==="ok" ? "✅" : "⚠️"}
              </span>
              <p style={{ margin:0, fontSize:13,
                color: sendStatus==="ok" ? SUCCESS : sendStatus==="error" ? DANGER : BLUE }}>
                {sendStatus==="sending"
                  ? "Invio all'Osservatorio in corso…"
                  : sendStatus==="ok"
                  ? "Segnalazione ricevuta dall'Osservatorio — nessuna altra azione richiesta."
                  : "Errore di rete: l'Osservatorio non ha ricevuto i dati. Scarica il CSV e invialo via email."}
              </p>
            </div>
          )}

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10,
            marginBottom:24, maxWidth:480, margin:"0 auto 24px" }}>
            {[
              ["Target", record?.target_nome],
              ["Acquirente", record?.acquirente_nome],
              ["Settore PEM®", record?.settore_pem],
              ["Provincia", record?.target_provincia],
              ["Tipologia", record?.tipologia_operazione],
              ["Affidabilità", record?.affidabilita],
            ].map(([k,v]) => v && (
              <div key={k} style={{ background:"#F5F8FC", borderRadius:8, padding:"9px 13px" }}>
                <p style={{ margin:0, fontSize:10, color:MUTED, textTransform:"uppercase",
                  letterSpacing:"0.06em", fontWeight:600 }}>{k}</p>
                <p style={{ margin:"3px 0 0", fontSize:13, color:"#1A1A2E", fontWeight:500 }}>{v}</p>
              </div>
            ))}
          </div>

          <div style={{ background:"#F0F7FF", border:`1px solid #B8D4F0`, borderRadius:10,
            padding:"16px 20px", marginBottom:22, maxWidth:560, marginLeft:"auto", marginRight:"auto" }}>
            <p style={{ margin:"0 0 10px", fontSize:12, fontWeight:700, color:NAVY,
              textTransform:"uppercase", letterSpacing:"0.05em" }}>
              📦 Istruzioni per il coordinatore
            </p>
            <p style={{ margin:"0 0 8px", fontSize:12, color:"#1A3A5C", lineHeight:1.6 }}>
              Hai {total} segnalazione{total !== 1 ? "i" : ""} in archivio.
              Esporta il CSV e copialo nella cartella{" "}
              <code style={{ background:"#E8F0FE", padding:"1px 5px", borderRadius:3 }}>submissions/</code>{" "}
              del progetto.
            </p>
            <div style={{ background:"#1B4F8A", borderRadius:7, padding:"8px 14px", fontFamily:"monospace",
              fontSize:12, color:"#AED6F1", marginBottom:8 }}>
              python gestisci.py tutto
            </div>
            <p style={{ margin:0, fontSize:11, color:"#4A6A8A" }}>
              Il comando valida, deduplica e aggiorna il master dataset, poi rigenera
              automaticamente report Word e presentazione PowerPoint.
            </p>
          </div>

          <div style={{ display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap" }}>
            <button type="button" onClick={onDownloadSingle}
              style={{ padding:"10px 20px", background:SUCCESS, color:"#fff", border:"none",
                borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer" }}>
              ⬇ Scarica questo deal (CSV)
            </button>
            <button type="button" onClick={onNew}
              style={{ padding:"10px 20px", background:NAVY, color:"#fff", border:"none",
                borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer" }}>
              + Nuova segnalazione
            </button>
            <button type="button" onClick={onShowArchive}
              style={{ padding:"10px 20px", background:"#fff", color:NAVY,
                border:`1.5px solid ${NAVY}`, borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer" }}>
              📋 Archivio ({total})
            </button>
          </div>
        </div>
      );
    }

    // ── Vista archivio ────────────────────────────────────────────────────────
    function ArchiveView({ records, onDelete, onDownload }) {
      return (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
            <h3 style={{ margin:0, color:NAVY }}>Archivio segnalazioni ({records.length})</h3>
            {records.length > 0 && (
              <button type="button" onClick={onDownload}
                style={{ padding:"8px 18px", background:SUCCESS, color:"#fff", border:"none",
                  borderRadius:7, fontSize:12, fontWeight:600, cursor:"pointer" }}>
                ⬇ Esporta CSV
              </button>
            )}
          </div>
          {records.length === 0 ? (
            <p style={{ color:MUTED, textAlign:"center", padding:40 }}>Nessuna segnalazione ancora.</p>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {records.map((r, i) => (
                <div key={i} style={{ background:"#fff", border:`1px solid ${BORDER}`, borderRadius:10,
                  padding:"14px 18px", display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
                      <span style={{ fontFamily:"monospace", fontSize:12, background:LIGHT,
                        color:NAVY, padding:"2px 8px", borderRadius:4, fontWeight:700 }}>
                        {r.deal_id}
                      </span>
                      <span style={{ fontSize:11, padding:"2px 8px", borderRadius:4,
                        background: r.affidabilita==="Alta" ? "#E8F8F0" : r.affidabilita==="Media" ? "#FFF9E6" : "#FEF0EE",
                        color: r.affidabilita==="Alta" ? SUCCESS : r.affidabilita==="Media" ? WARN : DANGER,
                        fontWeight:600 }}>
                        {r.affidabilita}
                      </span>
                    </div>
                    <p style={{ margin:"0 0 2px", fontWeight:700, fontSize:14, color:"#1A1A2E" }}>
                      {r.target_nome}
                    </p>
                    <p style={{ margin:0, fontSize:12, color:MUTED }}>
                      {r.acquirente_nome} · {r.tipologia_operazione} · {r.settore_pem} · {r.target_provincia}
                    </p>
                  </div>
                  <button type="button"
                    onClick={() => { if (window.confirm("Eliminare questa segnalazione?")) onDelete(i); }}
                    style={{ background:"none", border:"none", color:"#ccc", cursor:"pointer",
                      fontSize:18, padding:"0 4px", lineHeight:1 }}>
                    ×
                  </button>
                </div>
              ))}
            </div>
          )}
          <p style={{ fontSize:11, color:MUTED, marginTop:16, textAlign:"center" }}>
            I dati sono salvati nel browser (localStorage). Usare "Esporta CSV" per scaricarli.
          </p>
        </div>
      );
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<FormMA />);
  </script>
</body>
</html>
